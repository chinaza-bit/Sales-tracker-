<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Daily Ledger</title>
  <!-- Set the theme before the page paints, so there is no flash -->
  <script>
    (function () {
      var theme = 'light';
      try {
        var pref = JSON.parse(localStorage.getItem('daily-ledger-theme-pref') || '"system"');
        var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        theme = pref === 'dark' || (pref !== 'light' && systemDark) ? 'dark' : 'light';
      } catch (e) {}
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#2563EB">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Sales tracker">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="root">
    <div class="splash" role="status" aria-live="polite">
      <img src="apple-touch-icon.png" alt="" width="88" height="88" class="splash-icon">
      <p class="splash-msg">Every sale counted. Every naira accounted for.</p>
      <p class="splash-sub">Loading…</p>
    </div>
  </div>
  <noscript>Daily Ledger needs JavaScript to run.</noscript>

  <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js"></script>
  <script src="config.js"></script>
  <script type="text/babel" data-presets="react" src="app.js"></script>
  <script>
    // Keep the browser's "Install app" prompt so the app can offer a button for it
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.deferredInstall = e;
      window.dispatchEvent(new Event('installready'));
    });
    window.addEventListener('appinstalled', function () {
      window.deferredInstall = null;
      window.dispatchEvent(new Event('installdone'));
    });
  </script>
  <script>
    // Offline support and app updates.
    // If "Update the app automatically" is on (default), a new version is applied straight away.
    // If it is off, the app shows an "Update now" banner instead.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        var reloading = false;
        navigator.serviceWorker.register('sw.js').then(function (reg) {
          function autoUpdateOn() {
            try { return localStorage.getItem('daily-ledger-auto-update') !== 'off'; } catch (e) { return true; }
          }
          function applyUpdate(worker) {
            worker.postMessage({ type: 'SKIP_WAITING' });
          }
          function watch(worker) {
            worker.addEventListener('statechange', function () {
              if (worker.state === 'installed' && navigator.serviceWorker.controller) {
                window.waitingWorker = worker;
                if (autoUpdateOn()) applyUpdate(worker);
                else window.dispatchEvent(new Event('updateready'));
              }
            });
          }
          if (reg.waiting && navigator.serviceWorker.controller) {
            window.waitingWorker = reg.waiting;
            if (autoUpdateOn()) applyUpdate(reg.waiting);
            else window.dispatchEvent(new Event('updateready'));
          }
          reg.addEventListener('updatefound', function () {
            if (reg.installing) watch(reg.installing);
          });
          navigator.serviceWorker.addEventListener('controllerchange', function () {
            if (!reloading) { reloading = true; window.location.reload(); }
          });
          // Look for a new version each time the app is brought back to the front
          document.addEventListener('visibilitychange', function () {
            if (!document.hidden) reg.update().catch(function () {});
          });
          window.swRegistration = reg;
        }).catch(function () {});
      });
    }
  </script>
</body>
</html>
